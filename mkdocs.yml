site_name: Innovation Workshop Wiki
site_description: Equipment SOPs, Safety, and Guides for CNSI Workshops

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: deep orange
    - scheme: slate
      primary: blue
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.indexes
    - navigation.sections
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - About: about.md
  - Access & Training: access-and-training.md
  - Tools & Specs:
      - 3D Printing:
          - Bambu Lab: tools/3d-printing/bambu-lab.md
          - Form 4 Resin: tools/3d-printing/form4.md
      - Machining:
          - CNC Glass/Silicon: tools/machining/cnc-cutter.md
  - Lab Safety: lab-safety.md
  - Contact & People: people.md

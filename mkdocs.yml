site_name: Innovation Workshop Wiki
site_description: Equipment SOPs, Safety, and Guides for CNSI Workshops

theme:
  name: material
  palette:
      scheme: slate
      primary: teal
      accent: orange
      
  features:
    - navigation.instant   # Fast page loading without full reloads
    - navigation.tracking  # Updates URL hash as you scroll through headings
    #- navigation.tabs      # Displays top-level navigation as tabs
    - navigation.sections  # Groups sidebar items under sections
    - navigation.top       # Adds a "Back to top" button
    - search.suggest       # Auto-completes search terms
    - search.highlight     # Highlights search results on the page
    - content.code.copy    # Adds a copy button to code blocks
    - toc.integrate        # Merges the TOC into the navigation menu

extra_css:
    - stylesheets/extra.css


nav:
  - Home: index.md
  - About: about.md
  - Access & Training: access-and-training.md
  - Tool Pages:
      - 3D Printing:
          - Bambu X1C: tools/bambu-x1c.md
          - Bambu H2D: tools/bambu-h2d.md
          - Form 4: tools/form4.md
          - Form 3: tools/form3.md
      - Machining:
          - Haas CNC Super Mini Mill: tools/haas.md
          - Vertical Mill: tools/mill.md
          - Lathe: tools/lathe.md
          - Drill Press: tools/drill-press.md
          - Band Saw: tools/band-saw.md
          - Wazer Waterjet: tools/wazer.md
          - ThunderLaser Nova 35: tools/laser-cutter.md
      - Polymer Casting:
          - Thinky Planetary Mixer: tools/thinky.md
          - Silanization Chamber: tools/silane.md
          - Vacuum Chambers: tools/vacuum-chambers.md
          - Plasma Chamber: tools/plasma.md
          - UV Ozone Chamber: tools/uv-ozone.md
          - Convection Ovens: tools/ovens.md
  - Lab Safety: safety.md
  - Contact & People: people.md
